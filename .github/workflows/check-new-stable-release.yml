name: Check for a new stable kernel release

# Runs on a schedule and reacts to what kernel.org currently calls "stable".
# That can be more than one release line at once (e.g. 7.1.13 and 7.2.3 while
# 7.1 is winding down), and the two are handled differently:
#
#   * maintenance -- a newer point release in the series we already track
#     (the series of the newest configs/<x>). Regular PR on branch
#     kernel-config/v<version>; auto-merge-config.yml merges it without a
#     human if the only config drift is toolchain/version bookkeeping.
#
#   * next series -- a newer series than the one we track (7.2.x while we
#     track 7.1). Draft PR on branch kernel-config/v<series>.x, diffed
#     against the newest configs/<x> regardless of series. Never
#     auto-merged: a human reviews the (large) cross-series diff, merges it,
#     and pushes the v<version>-1 tag themselves. The one branch is reused
#     for the whole series -- when a newer point release lands, that same
#     draft PR is force-updated to it with fresh diffs.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: >
          Regenerate and (re-)PR even if this version looks already handled
          (config dir present, PR already open, draft already at this
          version). For testing the pipeline.
        required: false
        default: false
        type: boolean
      kernel_version_override:
        description: >
          Process this exact version instead of consulting releases.json.
          Routed by series: same series as the newest configs/<x> -> the
          maintenance path; a newer series -> the next-series draft path.
          Leave empty for normal scheduled behavior.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: check-new-stable-release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # inspect existing kernel-config/* PRs
    outputs:
      newest_tracked: ${{ steps.plan.outputs.newest_tracked }}
      tracked_series: ${{ steps.plan.outputs.tracked_series }}
      maintenance_version: ${{ steps.plan.outputs.maintenance_version }}
      next_series: ${{ steps.plan.outputs.next_series }}
      next_version: ${{ steps.plan.outputs.next_version }}
      next_branch: ${{ steps.plan.outputs.next_branch }}
      next_action: ${{ steps.plan.outputs.next_action }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          OVERRIDE: ${{ inputs.kernel_version_override }}
        run: |
          set -euo pipefail

          newest_tracked="$(find configs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          tracked_series="$(echo "$newest_tracked" | cut -d. -f1,2)"
          echo "Newest tracked config: $newest_tracked (series $tracked_series)"
          {
            echo "newest_tracked=$newest_tracked"
            echo "tracked_series=$tracked_series"
          } >> "$GITHUB_OUTPUT"

          # Candidate stable versions: everything releases.json calls "stable",
          # or just the override if one was given.
          if [ -n "$OVERRIDE" ]; then
            stable="$OVERRIDE"
          else
            stable="$(curl -fsSL https://www.kernel.org/releases.json \
                      | jq -r '.releases[] | select(.moniker=="stable") | .version')"
          fi
          if [ -z "$stable" ]; then
            echo "error: no stable versions to consider" >&2
            exit 1
          fi
          echo "Stable candidates: $(echo "$stable" | tr '\n' ' ')"

          # 'a newer than b' for dotted versions/series, via sort -V.
          newer_than() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]; }

          # --- maintenance: highest stable in the tracked series, if it is
          #     newer than the newest config we have ---
          maint="$(echo "$stable" | awk -F. -v s="$tracked_series" '($1"."$2) == s' | sort -V | tail -1 || true)"
          maintenance_version=""
          if [ -n "$maint" ] && newer_than "$maint" "$newest_tracked"; then
            maintenance_version="$maint"
          fi
          echo "maintenance_version=$maintenance_version" >> "$GITHUB_OUTPUT"
          echo "Maintenance target: ${maintenance_version:-(none)}"

          # --- next series: the highest stable series newer than the tracked
          #     one, and its highest stable point release ---
          next_series=""
          for ser in $(echo "$stable" | awk -F. '{print $1"."$2}' | sort -V -u); do
            if newer_than "$ser" "$tracked_series"; then
              next_series="$ser"   # ascending loop -> last match is the highest
            fi
          done

          next_version=""
          next_branch=""
          next_action="none"
          if [ -n "$next_series" ]; then
            next_version="$(echo "$stable" | awk -F. -v s="$next_series" '($1"."$2) == s' | sort -V | tail -1)"
            next_branch="kernel-config/v${next_series}.x"

            open_num="$(gh pr list --head "$next_branch" --state open --json number --jq '.[0].number // empty')"
            any_num="$(gh pr list --head "$next_branch" --state all --json number --jq '.[0].number // empty')"
            if [ -n "$open_num" ]; then
              # Update the existing draft only if it is not already at this
              # version. The current target is recorded as a marker in the
              # PR body (see the next-series job).
              cur="$(gh pr view "$open_num" --json body --jq .body \
                     | sed -n 's/.*<!-- next-series: \([0-9.]*\) -->.*/\1/p' | head -1)"
              if [ "$FORCE" = "true" ] || [ "$cur" != "$next_version" ]; then
                next_action="upsert"
              fi
            elif [ -z "$any_num" ]; then
              # No draft has ever been opened for this series -> open one.
              next_action="upsert"
            fi
            # A closed/merged PR for this branch and no open one -> leave it
            # alone; a human dealt with it (a merge advances the tracked
            # series on the next run anyway).
          fi
          {
            echo "next_series=$next_series"
            echo "next_version=$next_version"
            echo "next_branch=$next_branch"
            echo "next_action=$next_action"
          } >> "$GITHUB_OUTPUT"
          echo "Next series: ${next_series:-(none)}  version: ${next_version:-(none)}  action: $next_action"

  maintenance:
    name: Maintenance PR for ${{ needs.plan.outputs.maintenance_version }}
    needs: plan
    if: needs.plan.outputs.maintenance_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the kernel-config/v<version> branch
      pull-requests: write   # open the PR and post diff comments
      actions: write         # approve the PR's own held-for-approval checks
    env:
      VERSION: ${{ needs.plan.outputs.maintenance_version }}
    steps:
      # persist-credentials stays at its default (true): the branch is pushed
      # with plain `git push`, which uses actions/checkout's credential helper.
      - name: Check out
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Skip if this version is already handled
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          branch="kernel-config/v$VERSION"
          skip=false
          if [ "$FORCE" != "true" ]; then
            if [ -d "configs/$VERSION" ]; then
              echo "configs/$VERSION already exists"
              skip=true
            fi
            if [ "$(gh pr list --state open --head "$branch" --json number --jq 'length')" -gt 0 ]; then
              echo "An open PR for $branch already exists"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Generate configs and diffs
        if: steps.guard.outputs.skip != 'true'
        id: gen
        uses: ./.github/actions/generate-configs
        with:
          version: ${{ env.VERSION }}
          # diff-base omitted -> the newest configs/<x>, which for a
          # same-series bump is the previous tracked point release.

      - name: Create branch and commit the generated configs
        if: steps.guard.outputs.skip != 'true'
        id: commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          branch="kernel-config/v$VERSION"
          git checkout -b "$branch"
          git add "configs/$VERSION"
          git commit -m "configs: add generated configs for Linux $VERSION"
          git push origin "$branch" --force-with-lease
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.guard.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.gen.outputs.diff-base }}
        run: |
          set -euo pipefail
          branch="kernel-config/v$VERSION"
          body="Automatically generated configs for Linux $VERSION"
          if [ -n "$BASE" ]; then
            body="$body, diffed against the previously tracked $BASE."
          fi
          body="$body Per-flavor diffs follow as comments below."

          url="$(gh pr create \
            --title "configs: Linux $VERSION" \
            --body "$body" \
            --head "$branch" \
            --base main)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Approve pull_request runs for this commit
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/approve-pr-runs
        with:
          sha: ${{ steps.commit.outputs.sha }}

      - name: Post per-flavor diffs as PR comments
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVORS: ${{ steps.gen.outputs.flavors }}
          BASE: ${{ steps.gen.outputs.diff-base }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          for flavor in $FLAVORS; do
            {
              echo "### $flavor: Linux $VERSION diff vs $BASE"
              echo
              echo "<details><summary>Full config diff</summary>"
              echo
              echo '```diff'
              cat "${RUNNER_TEMP}/diffs/${flavor}.config.diff"
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>Minimal (defconfig) diff</summary>"
              echo
              echo '```diff'
              cat "${RUNNER_TEMP}/diffs/${flavor}.config-defconfig.diff"
              echo '```'
              echo
              echo "</details>"
            } | gh pr comment "$PR_URL" --body-file -
          done

  next-series:
    name: Next-series draft PR for ${{ needs.plan.outputs.next_version }}
    needs: plan
    if: needs.plan.outputs.next_action == 'upsert'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # force-push the kernel-config/v<series>.x branch
      pull-requests: write   # create/edit the draft PR and post diff comments
      actions: write         # approve the PR's own held-for-approval checks
    env:
      VERSION: ${{ needs.plan.outputs.next_version }}
      SERIES: ${{ needs.plan.outputs.next_series }}
      BRANCH: ${{ needs.plan.outputs.next_branch }}
      BASE: ${{ needs.plan.outputs.newest_tracked }}
    steps:
      - name: Check out
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Generate configs and diffs
        id: gen
        uses: ./.github/actions/generate-configs
        with:
          version: ${{ env.VERSION }}
          # A new series is judged against what we ship today, whatever series
          # that is -- the newest configs/<x>.
          diff-base: ${{ env.BASE }}

      # The branch carries the whole series: reset it to main plus exactly one
      # new configs/<version>/ directory every time, so the diff a reviewer
      # sees is always current-tip-of-series vs what we ship.
      - name: Reset the series branch to main + new configs
        id: commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" origin/main
          git add "configs/$VERSION"
          git commit -m "configs: add generated configs for Linux $VERSION (${SERIES}.x draft)"
          git push origin "+HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update the draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="configs: Linux $VERSION (next series — human review required)"
          body="$(cat <<EOF
          Auto-generated configs for Linux **$VERSION**, current tip of the
          \`${SERIES}\` series — newer than the series we track today (\`$BASE\`).

          **This is a draft on purpose.** A new series is never auto-merged.
          A human must review the cross-series diff in the comments below,
          merge this PR, and then push the \`v$VERSION-1\` tag to build it.

          Branch \`$BRANCH\` is reused for the whole \`${SERIES}\` series: when a
          newer point release appears, this same PR is force-updated to it
          with fresh diffs.

          <!-- next-series: $VERSION -->
          EOF
          )"

          num="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh pr edit "$num" --title "$title" --body "$body"
            url="$(gh pr view "$num" --json url --jq .url)"
          else
            url="$(gh pr create --draft \
              --title "$title" \
              --body "$body" \
              --head "$BRANCH" \
              --base main)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Approve pull_request runs for this commit
        uses: ./.github/actions/approve-pr-runs
        with:
          sha: ${{ steps.commit.outputs.sha }}

      - name: Post per-flavor diffs as PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVORS: ${{ steps.gen.outputs.flavors }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          for flavor in $FLAVORS; do
            {
              echo "### $flavor: Linux $VERSION diff vs $BASE (next series)"
              echo
              echo "<details><summary>Full config diff</summary>"
              echo
              echo '```diff'
              cat "${RUNNER_TEMP}/diffs/${flavor}.config.diff"
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>Minimal (defconfig) diff</summary>"
              echo
              echo '```diff'
              cat "${RUNNER_TEMP}/diffs/${flavor}.config-defconfig.diff"
              echo '```'
              echo
              echo "</details>"
            } | gh pr comment "$PR_URL" --body-file -
          done
