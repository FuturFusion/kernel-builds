name: Builds

# Manual, single-flavor build for ad hoc testing. Actual build steps live in
# _build-kernel.yml (shared with release-on-tag.yml, which builds every
# flavor per release tag); this workflow is just a thin front end for
# workflow_dispatch's inputs form.
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: >
          Exact kernel version to build, e.g. 6.19.4 or 7.1.0-rc2. No
          reference config is required for this -- genconfig.sh only needs
          one if you also turn on "validate" below.
        required: true
        type: string
      flavor:
        description: "Which flavor to build the .deb for."
        required: false
        default: generic
        type: choice
        options:
          - generic
          - server
          - virtio
      generate_config:
        description: >
          Generate a fresh config with genconfig.sh instead of using the one
          already committed at configs/<kernel_version>/<flavor>-config. Off
          by default: builds normally reuse whatever check-new-stable-release.yml
          generated and a human already reviewed/merged. Turn this on for a
          version that has no committed config yet, or to deliberately
          re-run the generator.
        required: false
        default: false
        type: boolean
      validate:
        description: >
          Also compare the generated config against misc/<series>/zabbly-config
          for this kernel's series, purely informational (shown in the job
          summary). Only has an effect when "generate config" above is also
          on. Off by default: a reference isn't needed to build a .deb, only
          to check fidelity against it, and this lets you package a kernel
          series that has no reference config yet. Turning this on fails the
          run if that series has no reference.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.flavor }}
    uses: ./.github/workflows/_build-kernel.yml
    with:
      kernel_version: ${{ inputs.kernel_version }}
      flavor: ${{ inputs.flavor }}
      generate_config: ${{ inputs.generate_config }}
      validate: ${{ inputs.validate }}
