name: Release on tag

# Tags look like v7.1.4-1: "v" + exact kernel version + "-" + a build
# iteration number. The iteration number exists so a mistake can be fixed
# with a v7.1.4-2 re-release of the same kernel version, rather than forcing
# a new kernel point release just to re-spin the packaging. That build
# version (e.g. "7.1.4-1", not a timestamp) becomes the .deb package version
# directly -- see _build-kernel.yml's package_version input.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  parse-tag:
    name: Parse the release tag
    runs-on: ubuntu-latest
    outputs:
      kernel_version: ${{ steps.parse.outputs.kernel_version }}
      package_version: ${{ steps.parse.outputs.package_version }}
      flavors: ${{ steps.flavors.outputs.list }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse kernel version and package version from the tag
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9][0-9a-zA-Z.-]*-[0-9]+$ ]]; then
            echo "error: tag '$tag' doesn't look like vKERNELVERSION-N (e.g. v7.1.4-1)" >&2
            exit 1
          fi

          # package_version is the tag as-is minus the leading "v" (e.g.
          # "7.1.4-3") -- used directly as the .deb version. kernel_version
          # additionally strips the trailing "-N" build suffix, since that's
          # what selects the actual kernel.org tag/configs/ entry to build.
          package_version="${tag#v}"
          kernel_version="${package_version%-*}"

          echo "Tag: $tag -> kernel version $kernel_version, package version $package_version"
          echo "kernel_version=$kernel_version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Determine flavors
        id: flavors
        run: |
          set -euo pipefail
          flavors="$(find flavors -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R -s -c 'split("\n")[:-1]')"
          echo "Flavors: $flavors"
          echo "list=$flavors" >> "$GITHUB_OUTPUT"

      # Fail fast, here on a plain ubuntu-latest runner, rather than after the
      # self-hosted build job has already installed dependencies and cloned
      # the multi-GB stable tree for every flavor -- release builds always
      # reuse an already-committed config (see _build-kernel.yml), so a
      # missing one is a release-blocking problem, not a build-time one.
      - name: Check that a committed config exists for every flavor
        env:
          KERNEL_VERSION: ${{ steps.parse.outputs.kernel_version }}
          FLAVORS: ${{ steps.flavors.outputs.list }}
        run: |
          set -euo pipefail
          missing=0
          for flavor in $(jq -r '.[]' <<< "$FLAVORS"); do
            config_file="configs/${KERNEL_VERSION}/${flavor}-config"
            if [ ! -f "$config_file" ]; then
              echo "error: no committed config at $config_file for kernel version '$KERNEL_VERSION', flavor '$flavor'." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "       Either wait for/merge the PR check-new-stable-release.yml opens for this version," >&2
            echo "       or build that flavor manually first via builds.yml with 'generate config' enabled." >&2
            exit 1
          fi
          echo "Config present for every flavor of Linux $KERNEL_VERSION."

  build:
    name: Build ${{ matrix.flavor }}
    needs: parse-tag
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.parse-tag.outputs.flavors) }}
    uses: ./.github/workflows/_build-kernel.yml
    with:
      kernel_version: ${{ needs.parse-tag.outputs.kernel_version }}
      flavor: ${{ matrix.flavor }}
      # Always use the already-reviewed, already-merged config from configs/
      # -- a release build never regenerates it from scratch.
      generate_config: false
      validate: false
      package_version: ${{ needs.parse-tag.outputs.package_version }}

  release:
    name: Create the GitHub release
    needs: [parse-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # GitHub caps a single *release asset* at 2GiB -- the unstripped -dbg
      # package can exceed that on its own. upload-artifact has no such
      # limit, so the workflow artifacts downloaded above are left whole;
      # anything at or over the limit is split here, right before it's
      # attached to the release, into <2GiB chunks named
      # <file>.partNNNofMMM (1-indexed, zero-padded) so the total part count
      # is visible from the filename alone. Reassemble with:
      # cat <file>.part*of<MMM> > <file>
      - name: Split any release assets over GitHub's 2GiB limit
        run: |
          set -euo pipefail
          asset_limit=2147483648
          chunk_bytes=$((1900 * 1024 * 1024)) # comfortable margin under the cap
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt "$asset_limit" ]; then
              continue
            fi

            total=$(( (size + chunk_bytes - 1) / chunk_bytes ))
            split -b "$chunk_bytes" -d -a 3 "$f" "${f}.part-"

            n=0
            while [ "$n" -lt "$total" ]; do
              idx=$((n + 1))
              mv "$(printf '%s.part-%03d' "$f" "$n")" \
                 "$(printf '%s.part%03dof%03d' "$f" "$idx" "$total")"
              n=$((n + 1))
            done
            rm "$f"
          done

      - name: Create the release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          KERNEL_VERSION: ${{ needs.parse-tag.outputs.kernel_version }}
          FLAVORS: ${{ join(fromJson(needs.parse-tag.outputs.flavors), ', ') }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no build artifacts were found to attach to the release" >&2
            exit 1
          fi

          notes="Kernel packages for Linux $KERNEL_VERSION, flavors: $FLAVORS."
          if find artifacts -type f -name '*.part[0-9][0-9][0-9]of[0-9][0-9][0-9]' | grep -q .; then
            notes="$notes"$'\n\n'"Some files (e.g. the -dbg package) exceed GitHub's 2GiB per-file limit and are split into \`<file>.partNNNofMMM\` chunks. Reassemble before use: \`cat <file>.part*of<MMM> > <file>\` (substitute the actual MMM from the filenames, e.g. \`of003\`)."
          fi

          gh release create "$TAG" \
            --title "Linux $KERNEL_VERSION ($TAG)" \
            --notes "$notes" \
            "${files[@]}"
