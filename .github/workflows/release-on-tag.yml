name: Release on tag

# Thin entry point: a pushed v* tag (a human tagging a version, or a re-spin
# like v7.1.4-2) triggers a full build + GitHub release. All the actual work
# lives in _release.yml, which auto-merge-config.yml also calls directly
# after it merges a toolchain-only config PR and pushes v<version>-1 (a
# GITHUB_TOKEN tag push does not itself trigger this workflow).
#
# workflow_dispatch is a manual fallback: re-run the build/release for a tag
# that already exists (e.g. the automatic run failed, or a tag was pushed
# with credentials that don't trigger workflows).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v7.1.12-1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    permissions:
      contents: write
    uses: ./.github/workflows/_release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
