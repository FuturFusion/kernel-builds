name: Generate kernel config

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      normalize:
        description: "Also normalize through the real Kconfig (make olddefconfig + savedefconfig)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    name: Discover series and flavors
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.series.outputs.series }}
      flavors: ${{ steps.flavors.outputs.flavors }}
      latest_version: ${{ steps.latest.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List series with a reference config
        id: series
        run: |
          set -euo pipefail
          series=$(for d in misc/*/; do
            s="$(basename "$d")"
            [ -f "misc/${s}/zabbly-config" ] && echo "$s"
          done | sort -V | jq -R -s -c 'split("\n")[:-1]')
          if [ "$series" = "[]" ]; then
            echo "error: no misc/<series>/zabbly-config found under misc/" >&2
            exit 1
          fi
          echo "Series found: $series"
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: List every flavor
        id: flavors
        run: |
          set -euo pipefail
          flavors=$(find flavors -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                    | sort | jq -R -s -c 'split("\n")[:-1]')
          if [ "$flavors" = "[]" ]; then
            echo "error: no flavors found under flavors/" >&2
            exit 1
          fi
          echo "Flavors found: $flavors"
          echo "flavors=$flavors" >> "$GITHUB_OUTPUT"

      - name: Find the newest tracked config version
        id: latest
        run: |
          set -euo pipefail
          version=$(find configs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                    | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "error: no configs/<version>/ directories found" >&2
            exit 1
          fi
          echo "Newest tracked config version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  reference-diff:
    name: generic vs misc/${{ matrix.series }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJson(needs.discover.outputs.series) }}

    env:
      FLAVOR: generic
      SERIES: ${{ matrix.series }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Determine kernel version
        id: kver
        run: |
          set -euo pipefail
          version="$(sed -n 's|^# Linux/x86 \([0-9][0-9.]*\) Kernel Configuration$|\1|p' \
                     "misc/${SERIES}/zabbly-config" | head -1)"
          if [ -z "$version" ]; then
            echo "error: could not determine the kernel version from misc/${SERIES}/zabbly-config" >&2
            exit 1
          fi
          echo "Configuring $SERIES against Linux $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the kernel source tree
        uses: ./.github/actions/setup-kernel-tree
        with:
          version: ${{ steps.kver.outputs.version }}

      - name: Check config_slices are disjoint
        run: ./check_slices.py "$FLAVOR"

      - name: Generate and validate the config
        env:
          NORMALIZE: ${{ inputs.normalize }}
        run: |
          if [ "$NORMALIZE" = "true" ] || [ -z "$NORMALIZE" ]; then
            ./genconfig.sh "$FLAVOR" --normalize --validate
          else
            ./genconfig.sh "$FLAVOR" --no-normalize --validate
          fi

      - name: Show diff against the reference config
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "output/${FLAVOR}/diff" ]; then
            echo "output/${FLAVOR}/diff was not produced -- the generation step must have failed."
            exit 1
          fi

          lines=$(wc -l < "output/${FLAVOR}/diff")
          echo "::notice::output/${FLAVOR}/diff ($SERIES) is $lines line(s)"

          {
            echo "## generic / $SERIES: diff vs misc/$SERIES/zabbly-config ($lines lines)"
            echo
            echo 'Left column is the reference config, right column is our generated config.'
            echo 'generic aims to reproduce the reference exactly, so every line here'
            echo 'is something to explain -- except compiler-driven divergence'
            # shellcheck disable=SC2016  # literal markdown backticks, not meant to expand
            echo '(`CC_VERSION_TEXT` and gcc-version-gated symbols), which is expected.'
            echo
            echo '```diff'
            cat "output/${FLAVOR}/diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "----- output/${FLAVOR}/diff -----"
          cat "output/${FLAVOR}/diff"
          echo "-----------------------"

      - name: Check config hardening
        run: |
          set -euo pipefail
          ./check-config-hardening.sh generated_config | tee "output/$FLAVOR/hardening.txt"

          echo "::notice::$(grep -F '[+] Check is finished:' "output/${FLAVOR}/hardening.txt" \
                            || echo 'hardening check finished')"

          {
            echo "## generic / $SERIES: hardening check"
            echo
            echo 'Reported, not enforced -- these flavors target distro kernels, so'
            echo 'FAIL lines are expected. Fails only if the checker itself errors.'
            echo
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat "output/${FLAVOR}/hardening.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated config and analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-${{ matrix.series }}-config
          path: |
            generated_config
            output/generic/
          if-no-files-found: warn

  all-flavors:
    name: ${{ matrix.flavor }} @ ${{ needs.discover.outputs.latest_version }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.discover.outputs.flavors) }}

    env:
      FLAVOR: ${{ matrix.flavor }}
      VERSION: ${{ needs.discover.outputs.latest_version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the kernel source tree
        uses: ./.github/actions/setup-kernel-tree
        with:
          version: ${{ needs.discover.outputs.latest_version }}

      - name: Check config_slices are disjoint
        run: ./check_slices.py "$FLAVOR"

      - name: Resolve the generated config path
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "generic" ]; then
            echo "CONFIG_FILE=generated_config" >> "$GITHUB_ENV"
          else
            echo "CONFIG_FILE=generated_config-$FLAVOR" >> "$GITHUB_ENV"
          fi

      - name: Generate the config
        env:
          NORMALIZE: ${{ inputs.normalize }}
        run: |
          if [ "$NORMALIZE" = "true" ] || [ -z "$NORMALIZE" ]; then
            ./genconfig.sh "$FLAVOR" --normalize --no-validate
          else
            ./genconfig.sh "$FLAVOR" --no-normalize --no-validate
          fi

      - name: Check config hardening
        run: |
          set -euo pipefail
          ./check-config-hardening.sh "$CONFIG_FILE" | tee "output/$FLAVOR/hardening.txt"

          echo "::notice::$(grep -F '[+] Check is finished:' "output/${FLAVOR}/hardening.txt" \
                            || echo 'hardening check finished')"

          {
            echo "## $FLAVOR @ $VERSION: hardening check"
            echo
            echo 'Reported, not enforced -- these flavors target distro kernels, so'
            echo 'FAIL lines are expected. Fails only if the checker itself errors.'
            echo
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat "output/${FLAVOR}/hardening.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated config and analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.flavor }}-${{ needs.discover.outputs.latest_version }}-config
          path: |
            ${{ env.CONFIG_FILE }}
            output/${{ matrix.flavor }}/
          if-no-files-found: warn
