name: Generate kernel config

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      normalize:
        description: "Also normalize through the real Kconfig (make olddefconfig + savedefconfig)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    name: Discover reference pairs, flavors and arches
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.pairs.outputs.pairs }}
      flavors: ${{ steps.flavors.outputs.flavors }}
      arches: ${{ steps.arches.outputs.arches }}
      latest_version: ${{ steps.latest.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One pair per misc/<series>/reference-<arch>-config that actually exists.
      - name: List (series, arch) reference pairs
        id: pairs
        run: |
          set -euo pipefail
          pairs=$(
            for d in misc/*/; do
              s="$(basename "$d")"
              for arch in $(tr '\n' ' ' < arches); do
                [ -f "misc/${s}/reference-${arch}-config" ] \
                  && printf '{"series":"%s","arch":"%s"}\n' "$s" "$arch"
              done
            done | jq -s -c 'sort_by(.series, .arch)')
          if [ "$pairs" = "[]" ]; then
            echo "error: no misc/<series>/reference-<arch>-config found under misc/" >&2
            exit 1
          fi
          echo "Reference pairs found: $pairs"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

      # Every flavor, .noautomation included: that marker only opts a flavor
      # out of the downstream commit/release automation, not out of CI.
      - name: List every flavor
        id: flavors
        run: |
          set -euo pipefail
          flavors=$(find flavors -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                    | sort | jq -R -s -c 'split("\n")[:-1]')
          if [ "$flavors" = "[]" ]; then
            echo "error: no flavors found under flavors/" >&2
            exit 1
          fi
          echo "Flavors found: $flavors"
          echo "flavors=$flavors" >> "$GITHUB_OUTPUT"

      - name: List arches
        id: arches
        run: |
          set -euo pipefail
          arches=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < arches)
          if [ "$arches" = "[]" ]; then
            echo "error: ./arches is empty" >&2
            exit 1
          fi
          echo "Arches found: $arches"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"

      - name: Find the newest tracked config version
        id: latest
        run: |
          set -euo pipefail
          version=$(find configs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                    | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "error: no configs/<version>/ directories found" >&2
            exit 1
          fi
          echo "Newest tracked config version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Fidelity: regenerate generic per (series, arch) and diff against its
  # reference. Only generic aims to reproduce one.
  reference-diff:
    name: generic/${{ matrix.arch }} vs misc/${{ matrix.series }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.pairs) }}

    env:
      PKGARCH: ${{ matrix.arch }}
      FLAVOR: generic
      SERIES: ${{ matrix.series }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The reference names its exact kernel version in its header (arch label
      # is the kernel's own SRCARCH spelling -- same mapping genconfig.sh uses).
      - name: Determine kernel version
        id: kver
        run: |
          set -euo pipefail
          case "$PKGARCH" in
            amd64) header_arch=x86 ;;
            arm64) header_arch=arm64 ;;
            *) echo "error: unknown arch '$PKGARCH'" >&2; exit 1 ;;
          esac
          reference="misc/${SERIES}/reference-${PKGARCH}-config"
          version="$(sed -n "s|^# Linux/${header_arch} \\([0-9][0-9.]*\\) Kernel Configuration\$|\\1|p" \
                     "$reference" | head -1)"
          if [ -z "$version" ]; then
            echo "error: could not determine the kernel version from $reference" >&2
            exit 1
          fi
          echo "Configuring $SERIES/$PKGARCH against Linux $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the kernel source tree
        uses: ./.github/actions/setup-kernel-tree
        with:
          version: ${{ steps.kver.outputs.version }}

      - name: Check config_slices are disjoint
        run: ./check_slices.py "$FLAVOR"

      - name: Generate and validate the config
        env:
          NORMALIZE: ${{ inputs.normalize }}
        run: |
          if [ "$NORMALIZE" = "true" ] || [ -z "$NORMALIZE" ]; then
            ./genconfig.sh "$PKGARCH" "$FLAVOR" --normalize --validate
          else
            ./genconfig.sh "$PKGARCH" "$FLAVOR" --no-normalize --validate
          fi

      - name: Show diff against the reference config
        if: always()
        run: |
          set -euo pipefail
          diff_file="output/${FLAVOR}/${PKGARCH}/diff"
          if [ ! -f "$diff_file" ]; then
            echo "$diff_file was not produced -- the generation step must have failed."
            exit 1
          fi

          lines=$(wc -l < "$diff_file")
          echo "::notice::$diff_file ($SERIES) is $lines line(s)"

          {
            echo "## generic/$PKGARCH / $SERIES: diff vs misc/$SERIES/reference-$PKGARCH-config ($lines lines)"
            echo
            echo 'Left column is the reference config, right column is our generated config.'
            echo 'generic aims to reproduce the reference exactly, so every line here'
            echo 'is something to explain -- except compiler-driven divergence'
            # shellcheck disable=SC2016  # literal markdown backticks, not meant to expand
            echo '(`CC_VERSION_TEXT` and gcc-version-gated symbols), which is expected.'
            echo
            echo '```diff'
            cat "$diff_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "----- $diff_file -----"
          cat "$diff_file"
          echo "-----------------------"

      # Informational: kernel-hardening-checker exits non-zero only when it
      # cannot run, so not swallowing its status is exactly what we want.
      - name: Check config hardening
        run: |
          set -euo pipefail
          report="output/${FLAVOR}/${PKGARCH}/hardening.txt"
          ./check-config-hardening.sh "generated_config-${FLAVOR}-${PKGARCH}" | tee "$report"

          echo "::notice::$(grep -F '[+] Check is finished:' "$report" \
                            || echo 'hardening check finished')"

          {
            echo "## generic/$PKGARCH / $SERIES: hardening check"
            echo
            echo 'Reported, not enforced -- these flavors target distro kernels, so'
            echo 'FAIL lines are expected. Fails only if the checker itself errors.'
            echo
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat "$report"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated config and analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-${{ matrix.arch }}-${{ matrix.series }}-config
          path: |
            generated_config-generic-${{ matrix.arch }}
            output/generic/${{ matrix.arch }}/
          if-no-files-found: warn

  # Coverage: regenerate every flavor (.noautomation included) for every arch
  # against the newest tracked version. No reference diff -- just that
  # generation succeeds.
  all-flavors:
    name: ${{ matrix.flavor }}/${{ matrix.arch }} @ ${{ needs.discover.outputs.latest_version }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.discover.outputs.flavors) }}
        arch: ${{ fromJson(needs.discover.outputs.arches) }}

    env:
      FLAVOR: ${{ matrix.flavor }}
      PKGARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.discover.outputs.latest_version }}
      CONFIG_FILE: generated_config-${{ matrix.flavor }}-${{ matrix.arch }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the kernel source tree
        uses: ./.github/actions/setup-kernel-tree
        with:
          version: ${{ needs.discover.outputs.latest_version }}

      - name: Check config_slices are disjoint
        run: ./check_slices.py "$FLAVOR"

      # --no-validate: no misc/<series>/reference-<arch>-config for an exact
      # point release, and the comparison only means anything for generic.
      - name: Generate the config
        env:
          NORMALIZE: ${{ inputs.normalize }}
        run: |
          if [ "$NORMALIZE" = "true" ] || [ -z "$NORMALIZE" ]; then
            ./genconfig.sh "$PKGARCH" "$FLAVOR" --normalize --no-validate
          else
            ./genconfig.sh "$PKGARCH" "$FLAVOR" --no-normalize --no-validate
          fi

      - name: Check config hardening
        run: |
          set -euo pipefail
          report="output/${FLAVOR}/${PKGARCH}/hardening.txt"
          ./check-config-hardening.sh "$CONFIG_FILE" | tee "$report"

          echo "::notice::$(grep -F '[+] Check is finished:' "$report" \
                            || echo 'hardening check finished')"

          {
            echo "## $FLAVOR/$PKGARCH @ $VERSION: hardening check"
            echo
            echo 'Reported, not enforced -- these flavors target distro kernels, so'
            echo 'FAIL lines are expected. Fails only if the checker itself errors.'
            echo
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat "$report"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated config and analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.flavor }}-${{ matrix.arch }}-${{ needs.discover.outputs.latest_version }}-config
          path: |
            ${{ env.CONFIG_FILE }}
            output/${{ matrix.flavor }}/${{ matrix.arch }}/
          if-no-files-found: warn
