self-hosted-runner:
  # Labels used by our self-hosted kernel-build runner (see _build-kernel.yml's
  # runs-on:). actionlint has no way to know about these otherwise and would
  # flag every one of them as an unknown/typoed GitHub-hosted label.
  labels:
    - futurfusion-kernel-build
    - arch-amd64
    - arch-arm64
    - image-debian-13
